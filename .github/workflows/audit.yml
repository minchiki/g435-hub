name: Dependency audit

on:
  schedule:
    - cron: '17 6 * * 1'
  push:
    paths: ['hub/Cargo.lock']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: hub
        run: cargo audit
