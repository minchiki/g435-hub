name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hub

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        working-directory: hub
        run: cargo test --release

      - name: Build installers
        working-directory: hub
        run: npx --yes @tauri-apps/cli@2 build

      - name: Collect release files
        shell: pwsh
        run: |
          $v = (Get-Content hub/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out, portable | Out-Null
          Copy-Item (Get-ChildItem hub/target/release/bundle/nsis/*-setup.exe).FullName "out/G435-Hub_${v}_x64-setup.exe"
          Copy-Item (Get-ChildItem hub/target/release/bundle/msi/*.msi).FullName "out/G435-Hub_${v}_x64.msi"
          Copy-Item hub/target/release/g435-hub.exe "portable/G435 Hub.exe"
          Copy-Item LICENSE, THIRD-PARTY-NOTICES portable/
          Compress-Archive -Path portable/* -DestinationPath "out/G435-Hub_${v}_x64-portable.zip"
          Push-Location out
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content SHA256SUMS.txt -Encoding ascii
          Pop-Location
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem out -File).FullName `
            --title "G435 Hub ${{ github.ref_name }}" --notes-file .github/release-notes.md
